[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edupro"
version = "0.1.0"
description = "Student segmentation and personalized course recommendation system for EduPro"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Kartik", email = "kartikshreekumar2006@gmail.com" }]
keywords = ["segmentation", "clustering", "recommender-system", "education", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are pinned in requirements.txt (the authoritative,
# validated set). They are intentionally declared with lower bounds here so the
# package remains installable in a compatible environment.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "streamlit>=1.40",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyterlab>=4.0", "ipykernel>=6.29", "pypdf>=5.0", "pymupdf>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests that take a noticeable amount of time to run",
]

[tool.ruff]
line-length = 100
target-version = "py313"
